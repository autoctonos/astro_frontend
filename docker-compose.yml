services:
  # Desarrollo con hot reload (código montado como volumen)
  astro-dev:
    build:
      context: .
      target: dev
      args:
        - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:8000}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    profiles:
      - dev

  # Servidor SSR de producción (adapter Node). Las PUBLIC_* van en build time;
  # las PAYU_* se leen en runtime desde .env y nunca quedan dentro de la imagen.
  astro-prod:
    build:
      context: .
      target: production
      args:
        - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:8000}
        - PUBLIC_ASSETS_ORIGIN=${PUBLIC_ASSETS_ORIGIN:-}
        - PUBLIC_SHIPPING_MOCK=${PUBLIC_SHIPPING_MOCK:-}
    ports:
      - "4321:4321"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    profiles:
      - prod
